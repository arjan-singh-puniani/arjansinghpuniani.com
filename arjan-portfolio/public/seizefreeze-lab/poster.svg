  <title>SeizeFreeze proposed component stack</title>
  <desc>Diagrammatic exploded architecture. A package and control board sit above a candidate hot-side path, thermoelectric module, insulated cold plate and cortical contact. Sensors connect the interface to control. Layer spacing and dimensions are illustrative; chronic heat rejection and power delivery remain unresolved.</desc>
