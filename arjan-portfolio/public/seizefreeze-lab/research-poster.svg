<title id="title">Organoid research apparatus: static explanatory diagram</title>
<desc id="desc">A spherical organoid in well-mixed medium, above a recording substrate and thermoelectric cooler with an external heat rejection boundary. Diagrammatic dimensions. The neutral radial rings explain the model, not a measured temperature field.</desc>
